# Donkey controller layout while the on-screen keyboard is up.
# F13-F24 never reach Firefox: launch.sh binds them in Sway and forwards
# them to the keyboard's control FIFO. Plain keys go straight to Firefox.
version: 1
kind: DeviceProfile
name: Donkey keys
description: Type with the D-pad and face buttons

target_devices:
  - mouse
  - keyboard

mapping:
  - name: Pointer
    source_event:
      gamepad:
        axis:
          name: RightStick
    target_events:
      - mouse:
          motion:
            speed_pps: 800

  - name: Click (trigger)
    source_event:
      gamepad:
        trigger:
          name: RightTrigger
          deadzone: 0.25
    target_events:
      - mouse:
          button: Left

  - name: Ring up
    source_event:
      gamepad:
        button: DPadUp
    target_events:
      - keyboard: KeyF13

  - name: Ring down
    source_event:
      gamepad:
        button: DPadDown
    target_events:
      - keyboard: KeyF14

  - name: Ring left
    source_event:
      gamepad:
        button: DPadLeft
    target_events:
      - keyboard: KeyF15

  - name: Ring right
    source_event:
      gamepad:
        button: DPadRight
    target_events:
      - keyboard: KeyF16

  - name: Ring up (stick)
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: up
          deadzone: 0.5
    target_events:
      - keyboard: KeyF13

  - name: Ring down (stick)
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: down
          deadzone: 0.5
    target_events:
      - keyboard: KeyF14

  - name: Ring left (stick)
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: left
          deadzone: 0.5
    target_events:
      - keyboard: KeyF15

  - name: Ring right (stick)
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: right
          deadzone: 0.5
    target_events:
      - keyboard: KeyF16

  - name: Type the ringed key
    source_event:
      gamepad:
        button: South
    target_events:
      - keyboard: KeyF17

  - name: Backspace
    source_event:
      gamepad:
        button: East
    target_events:
      - keyboard: KeyBackspace

  - name: Space
    source_event:
      gamepad:
        button: West
    target_events:
      - keyboard: KeySpace

  - name: Hide keyboard (F24 -> Sway -> toggle)
    source_event:
      gamepad:
        button: North
    target_events:
      - keyboard: KeyF24

  - name: Enter
    source_event:
      gamepad:
        button: Start
    target_events:
      - keyboard: KeyEnter

  - name: Symbols layer
    source_event:
      gamepad:
        button: Select
    target_events:
      - keyboard: KeyF21

  - name: Shift
    source_event:
      gamepad:
        trigger:
          name: LeftTrigger
          deadzone: 0.25
    target_events:
      - keyboard: KeyF19

  - name: Cursor left
    source_event:
      gamepad:
        button: LeftBumper
    target_events:
      - keyboard: KeyLeft

  - name: Cursor right
    source_event:
      gamepad:
        button: RightBumper
    target_events:
      - keyboard: KeyRight

  - name: Exit Donkey (F23 -> Sway -> exit.sh)
    source_event:
      gamepad:
        button: Guide
    target_events:
      - keyboard: KeyF23
